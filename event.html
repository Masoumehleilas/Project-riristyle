<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event</title>
    <link rel="stylesheet" href="event.css" />
  </head>

  <body>
    <div class="project">
      <div class="all">
        <div class="l">
          <p class="date">December 25, 2026</p>

          <h1>Join the event</h1>

          <form>
            <div class="inputt">
              <div class="input_a">
                <label for="first">First Name</label>
                <input
                  type="text"
                  id="first"
                  placeholder="Enter your first name"
                />
              </div>

              <div class="input_a">
                <label for="last">Last Name</label>
                <input
                  type="text"
                  id="last"
                  placeholder="Enter your last name"
                />
              </div>
            </div>

            <div class="inputt">
              <div class="input_a">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" />
              </div>

              <div class="input_a">
                <label for="title">Title</label>
                <input
                  type="text"
                  id="title"
                  placeholder="What is your job title?"
                />
              </div>
            </div>

            <div class="check">
              <input type="checkbox" id="cb" />

              <label for="cb">
                I would like to receive emails about future event
              </label>
            </div>

            <button type="submit">Register for this event</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
