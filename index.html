<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>riristyle</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <header>
      <p>RiriStyle</p>
    </header>
    <nav>
      <div class="top-right">
        <a href="#">
          <i class="far fa-user"></i>
        </a>
        <a href="#">
          <i class="fas fa-shopping-cart"></i>
        </a>
        <a href="#">
          <i class="fas fa-home"></i>
        </a>
        <a href="#">
          <i class="fas fa-search"></i>
        </a>
      </div>
      <div class="login-button">
        <i class="fas fa-user"></i>
        <a href="#">ثبت نام / ورود</a>
      </div>
    </nav>
    <div id="carouselExample" class="carousel slide">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="p1.jpg" class="d-block w-100" alt="عکس اول" />
        </div>

        <div class="carousel-item">
          <img src="p2.jpg" class="d-block w-100" alt="عکس دوم" />
        </div>

        <div class="carousel-item">
          <img src="p3.jpg" class="d-block w-100" alt="عکس سوم" />
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
    <div class="row">
      <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12">
        <div class="shoping-item">
          <div class="img-sec">
            <img src="z4.jpg" alt="" />
            <span class="hot-offer">پیشنهاد ویژه</span>
            <div class="stars">
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
            </div>
          </div>
          <div class="title">اکسسوری</div>
          <div class="buttons">
            <div class="right">
              <span class="price">507,000 تومان</span>
            </div>
            <div class="left">
              <div class="extend-btn">
                <span class="b-text">علاقه</span>
                <a class="b-icon" href=""><i class="fas fa-heart"></i></a>
              </div>
              <div class="extend-btn">
                <span class="b-text">خرید</span>
                <a class="b-icon" href=""
                  ><i class="fas fa-shopping-cart"></i
                ></a>
              </div>

              <i class="fas fa-star"></i>

          </div>
          <div class="title">شال و روسری</div>
          <div class="buttons">
            <div class="right">
